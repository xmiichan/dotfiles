ytdl-format=bv[height<=720][ext=mp4]+(ba[format_note*=original]/ba)

[kitty]
vo=kitty
vo-kitty-use-shm=yes
vo-kitty-auto-multiplexer-passthrough=yes
vo-kitty-config-clear=yes
vo-kitty-alt-screen=no
profile=sw-fast
hwdec=auto
keepaspect
scale=bilinear
cscale=bilinear
dscale=bilinear
msg-level=all=no
term-status-msg=
term-osd-bar=no
input-ipc-server=/tmp/mpvsocket
input-cursor=no

[tct]
vo=tct
vo-tct-buffering=frame
vo-tct-algo=half-blocks
profile=sw-fast
hwdec=auto
vf=fps=24
ytdl-format=bestvideo[height<=360][ext=mp4]+(ba[format_note*=original]/ba)
input-ipc-server=/tmp/mpvsocket

[float]
force-window=yes
ontop=yes
x11-name=mpv-float
wayland-app-id=mpv-float
title=${?media-title:${media-title} }[mpv-float]
macos-title-bar-appearance=darkAqua
geometry=30%-20+20
