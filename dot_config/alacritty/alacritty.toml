[general]
live_config_reload = true

[colors.primary]
background = "#000000"

[window]
dimensions = { columns = 100, lines = 32 }
padding = { x = 5, y = 5 }
decorations = "Full"
decorations_theme_variant = "Dark"
option_as_alt = "OnlyLeft"

[font]
normal = { family = "UDEV Gothic NFLG", style = "Regular" }
size = 16

[[hints.enabled]]
hyperlinks = true
regex = '''(https?://|ssh://|ftp://|ftps://|mailto:|magnet:|gemini://|gopher://)\S+'''
command = { program = "open", args = [] }
binding = { mods = "Command", key = "Period" }
mouse = { enabled = true, mods = "Command" }

[keyboard]
bindings = [
    { key = "W", mods = "Command", chars = "\u0004" },
]

[mouse]
hide_when_typing = true
