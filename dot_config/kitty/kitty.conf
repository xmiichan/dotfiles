include ~/.config/kitty/colors.conf
# custom_shaders crt-blue 

# cursor
shell_integration no-cursor
cursor_shape block
# cursor_trail 1

# font
font_family Iosevka Nerd Font Mono
font_size 16.0
font_features IosevkaNFM -calt +dlig +ss14
font_features IosevkaNFM-SemiBold -calt +dlig +ss14
font_features IosevkaNFM-Oblique -calt +dlig +ss14
font_features IosevkaNFM-SemiBoldItalic -calt +dlig +ss14
modify_font cell_height 80%
modify_font baseline 120%

# window
remember_window_size no
initial_window_width 100c
initial_window_height 32c
window_margin_width 5
macos_titlebar_color background
placement_strategy center
mouse_hide_wait	-3.0

# macos
macos_option_as_alt left

# disable tabs / splits, and other disruptive shortcuts
map kitty_mod+enter no_op
map cmd+enter       no_op
map kitty_mod+f     no_op
map cmd+f           no_op
map kitty_mod+t     no_op
map cmd+t           no_op
