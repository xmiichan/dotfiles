include ~/.config/kitty/catppuccin-mocha.conf
background #000000

# cursor
shell_integration no-cursor
cursor_shape block

# font
font_family PlemolJP Console NF
font_size 16.0

# window
initial_window_width 100c
initial_window_height 32c
window_margin_width 5
macos_titlebar_color background
placement_strategy center
mouse_hide_wait	-3.0

# macos
macos_option_as_alt left

# disable tabs / splits, and other disruptive shortcuts
map kitty_mod+enter no_op
map cmd+enter       no_op
map kitty_mod+f     no_op
map cmd+f           no_op
map kitty_mod+t     no_op
map cmd+t           no_op
