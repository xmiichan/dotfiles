include ~/.config/kitty/catppuccin-mocha.conf
background #000000
# custom_shaders crt-blue 

# cursor
shell_integration no-cursor
cursor_shape block
# cursor_trail 1

# font
font_family UDEV Gothic NFLG
font_size 16.0
font_features UDEVGothicNFLG-Regular     +ss19
font_features UDEVGothicNFLG-Bold        +ss19
font_features UDEVGothicNFLG-Italic      +ss19
font_features UDEVGothicNFLG-BoldItalic  +ss19

# window
initial_window_width 100c
initial_window_height 32c
window_margin_width 5
macos_titlebar_color background
placement_strategy center
mouse_hide_wait	-3.0

# macos
macos_option_as_alt left

# disable tabs / splits, and other disruptive shortcuts
map kitty_mod+enter no_op
map cmd+enter       no_op
map kitty_mod+f     no_op
map cmd+f           no_op
map kitty_mod+t     no_op
map cmd+t           no_op
