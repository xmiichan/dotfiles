{{- /* chezmoi:modify-template */ -}}
[Posteo]
source             = maildir://~/.local/share/mail
outgoing           = msmtp --read-envelope-from
use-envelope-from  = true
pgp-auto-sign      = true

{{- $line := .chezmoi.stdin | regexFind "(?m)^from\\s*=.*$" }}
{{- if $line }}
{{ $line }}
{{- else }}
from               = <{{ .email }}>
{{- end }}

{{- $line := .chezmoi.stdin | regexFind "(?m)^aliases\\s*=.*$" }}
{{- if $line }}
{{ $line }}
{{ end -}}

default            = INBOX
folders-sort       = INBOX,Sent,Drafts,Archive,Trash
folders-exclude    = Notes
archive            = Archive
postpone           = Drafts
copy-to            = Sent
check-mail         = 5m
check-mail-cmd     = GPG_TTY= mbsync -a
check-mail-timeout = 2m

