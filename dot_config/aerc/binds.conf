# Binds are of the form <key sequence> = <command to run>
# To use '=' in a key sequence, substitute it with "Eq": "<Ctrl+Eq>"
# If you wish to bind #, you can wrap the key sequence in quotes: "#" = quit
\[t = :prev-tab<Enter>
\]t = :next-tab<Enter>
gT = :prev-tab<Enter>
gt = :next-tab<Enter>
<C-t> = :term<Enter>
<C-l> = :redraw<Enter>
? = :help keys<Enter>
<C-z> = :suspend<Enter>
<C-c> = :choose -o y 'Really quit' q<Enter>
<C-f> = :menu -dc fzf -t 'Go to...' :cf <Enter>

[messages]
. = :repeat

j = :next<Enter>
<C-n> = :next<Enter>
<Down> = :next<Enter>
<C-d> = :next 50%<Enter>
<PgDn> = :next 100%<Enter>

k = :prev<Enter>
<C-p> = :prev<Enter>
<Up> = :prev<Enter>
<C-u> = :prev 50%<Enter>
<PgUp> = :prev 100%<Enter>
gg = :select 0<Enter>
G = :select -1<Enter>

J = :next-folder<Enter>
K = :prev-folder<Enter>
H = :collapse-folder<Enter>
L = :expand-folder<Enter>
tf = :toggle-folder<Enter>

v = :mark -t<Enter>
<Space> = :mark -t<Enter>:next<Enter>
V = :mark -v<Enter>

T = :toggle-threads<Enter>
zc = :fold<Enter>
zo = :unfold<Enter>
za = :fold -t<Enter>
zM = :fold -a<Enter>
zR = :unfold -a<Enter>
<tab> = :fold -t<Enter>

zz = :align center<Enter>
zt = :align top<Enter>
zb = :align bottom<Enter>

<Enter> = :view<Enter>
dd = :read<Enter>:move Trash<Enter>
a = :archive flat<Enter>
u = :unmark -a<Enter>:mark -T<Enter>:archive flat<Enter>

C = :compose<Enter>
b = :bounce<space>

rr = :reply -a<Enter>
rq = :reply -aq<Enter>
Rr = :reply<Enter>
Rq = :reply -q<Enter>

$ = :term<space>
! = :term<space>
| = :pipe<space>

/ = :search<space>
\ = :filter<space>
n = :next-result<Enter>
N = :prev-result<Enter>
<Esc> = :clear<Enter>

s = :split<Enter>
S = :vsplit<Enter>

pl = :patch list<Enter>
pa = :patch apply <Tab>
pd = :patch drop <Tab>
pb = :patch rebase<Enter>
pt = :patch term<Enter>
ps = :patch switch <Tab>

m = :menu -dc 'fzf' -t 'Move message' :move<Enter>

[messages:folder=Drafts]
<Enter> = :recall<Enter>

[messages:folder=Trash]
dd = :choose -o y 'Permanently delete this message' delete-message<Enter>

[view]
/ = :toggle-key-passthrough<Enter>/
q = :close<Enter>
O = :open<Enter>
o = :open<Enter>
S = :save<space>
| = :pipe<space>
A = :archive flat<Enter>

<C-y> = :menu -lc fzf -t 'Copy link' :copy-link<Enter>
<C-l> = :menu -lc fzf -t 'Open link' :open-link<Enter>

f = :forward<Enter>
rr = :reply -a<Enter>
rq = :reply -aq<Enter>
Rr = :reply<Enter>
Rq = :reply -q<Enter>

H = :toggle-headers<Enter>
<C-k> = :prev-part<Enter>
<C-Up> = :prev-part<Enter>
<C-j> = :next-part<Enter>
<C-Down> = :next-part<Enter>
J = :next<Enter>
<C-Right> = :next<Enter>
K = :prev<Enter>
<C-Left> = :prev<Enter>

[view::passthrough]
$noinherit = true
$ex = <C-x>
<Esc> = :toggle-key-passthrough<Enter>
<C-z> = :suspend<Enter>

[compose]
# Keybindings used when the embedded terminal is not selected in the compose
# view
$noinherit = true
$ex = <C-x>
$complete = <C-o>
<A-p> = :switch-account -p<Enter>
<A-n> = :switch-account -n<Enter>
<C-n> = :next-field<Enter>
<C-p> = :prev-field<Enter>
\[t = :prev-tab<Enter>
\]t = :next-tab<Enter>
gT = :prev-tab<Enter>
gt = :next-tab<Enter>
<C-c> = :choose -o y 'Really abort compose' abort<Enter>
<C-z> = :suspend<Enter>

[compose::editor]
# Keybindings used when the embedded terminal is selected in the compose view
$noinherit = true
$ex = <C-x>
<C-n> = :next-field<Enter>
<C-p> = :prev-field<Enter>
<C-c> = :choose -o y 'Really abort compose' abort<Enter>
<C-z> = :suspend<Enter>

[compose::review]
# Keybindings used when reviewing a message to be sent
# Inline comments are used as descriptions on the review screen
y = :send<Enter> # Send
n = :choose -o y 'Really abort compose' abort<Enter> # Abort
s = :sign<Enter> # Toggle signing
x = :encrypt<Enter> # Toggle encryption to all recipients
v = :preview<Enter> # Preview message
p = :postpone<Enter> # Postpone
q = :choose -o d discard abort -o p postpone postpone<Enter> # Abort or postpone
e = :edit<Enter> # Edit (body and headers)
a = :menu -c 'yazi --chooser-file=%f' :attach<Enter> # Add attachment
d = :detach<space> # Remove attachment

<C-c> = :choose -o y 'Really abort compose' abort<Enter> # Cancel
<C-z> = :suspend<Enter>

[terminal]
$noinherit = true
$ex = <C-x>
<C-z> = :suspend<Enter>
<C-p> = :prev-tab<Enter>
<C-n> = :next-tab<Enter>
