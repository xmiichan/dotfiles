[general]
default-save-path=~/Downloads
use-terminal-pinentry = true

[ui]
styleset-name=catppuccin-mocha
dirlist-tree=true
index-columns=date<19,flags>4,name<22,subject
column-name={{ .Peer | names | join ", " }}
timestamp-format=2006-01-02 15:04
this-day-time-format=15:04
this-week-time-format=Mon 15:04
this-year-time-format=2006-01-02
message-view-timestamp-format=2006-01-02 15:04
threading-enabled=true
thread-prefix-tip=" "
thread-prefix-folded="▸"
column-subject={{.ThreadPrefix}}{{if .Subject}}{{.Subject}}{{else}}{{.SubjectBase}}{{end}}

[viewer]
alternatives=text/plain,text/html

[compose]
editor=nvim
address-book-cmd=khard email --parsable --remove-first-line %s
no-attachment-warning=^[^>]*attach(ed|ment)
reply-to-self=false

[filters]
text/plain=wrap -w 80 | colorize
text/calendar=calendar
message/delivery-status=colorize
message/rfc822=colorize
text/html=! html
.headers=colorize
