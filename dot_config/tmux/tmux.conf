# basic settings
set  -g default-terminal   tmux-256color
setw -g mode-keys          vi
set  -g mouse              on
set  -g display-panes-time 1000
set  -g history-limit      50000
set  -g focus-events       on
set  -g allow-passthrough  on
set  -g extended-keys      on
set  -s set-clipboard      on

set  -s escape-time   0

setw -g automatic-rename  on
setw -g monitor-activity  on
setw -g clock-mode-style  24
setw -g alternate-screen  on

set  -g visual-activity   off
set  -g visual-bell       off
set  -g display-time      4000
set  -g status-keys       emacs
setw -g aggressive-resize on

set  -g default-shell     /bin/zsh
set  -g default-command   /bin/zsh
set  -g set-titles        on
set  -g set-titles-string "#{session_name}"
setw -g allow-rename      on
set  -g allow-passthrough on
set  -g renumber-windows  off
set  -g base-index        1
set  -g detach-on-destroy no-detached

# terminal settings
set -sa terminal-overrides ",tmux-256color:Tc,xterm*:Tc"
## undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
## colored underline support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
## extended keys -- this fucks up things, use only with certain terminals
# set -as terminal-features 'xterm*:extkeys'

# mode
set -g mode-style bg=brightblack,fg=default

# status bar
set -g status-left-length  100
set -g status-right-length 100

## status position
set -g status-position top
set -g status-justify  right

## status update interval
set -g status-interval 5

## status bar colors
set -g status-style  bg=default,fg=default
set -g message-style bg=default,fg=yellow,fill=terminal,width=50%

## left status
set -g  status-left "#[bg=default,fg=brightblue,bold] #S "
set -ga status-left "#[default][#[fg=yellow]#I:#P#[default]] "
set -ga status-left "#{?client_prefix,#[fg=yellow bold]CMD,}"
set -ga status-left "#{?pane_in_mode,#[fg=blue bold]-- COPY -- ,}"
set -ga status-left "#{?pane_synchronized,#[fg=magenta bold]-- SYNC -- ,}"

## right status
set -g status-right " "

## window status
set -g  window-status-current-format "#[fg=brightblack,bg=green,bold]#{?window_zoomed_flag,[#I], #I }"
set -ga window-status-current-format "#[bg=default,fg=white,bold]#{?automatic-rename,, #W }"
set -g  window-status-format         "#[fg=white,bg=brightblack,nobold]#{?window_activity_flag,#[fg=brightred],}#{?window_zoomed_flag,[#I], #I }"
set -ga window-status-format         "#[bg=default,fg=white,nobold]#{?automatic-rename,, #W }"
set -g  window-status-separator      " "
set -g  window-status-activity-style fg=white,bg=default

## hide status bar when there's only one window
set -g status off
set-hook -g after-new-window      'if "[ #{session_windows} -gt 1 ]" "set status on"'
set-hook -g after-kill-pane       'if "[ #{session_windows} -lt 2 ]" "set status off"'
set-hook -g pane-exited           'if "[ #{session_windows} -lt 2 ]" "set status off"'
set-hook -g window-layout-changed 'if "[ #{session_windows} -lt 2 ]" "set status off"'

# panes
## pane border
set -g pane-border-style        bg=default,fg=brightblack
set -g pane-active-border-style bg=default,fg=white
set -g pane-border-status       top
set -g pane-border-format       "[ #{pane_title} ]"

# hide pane border when only one pane is active
set-hook -g -w pane-focus-in "set-option -Fw pane-border-status '#{?#{e|>:#{window_panes},1},top,off}'"

## pane number indicator
set -g display-panes-colour        brightblack
set -g display-panes-active-colour brightwhite

## pane setup
set -g main-pane-height "60%"
set -g main-pane-width  "60%"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'roosta/tmux-fuzzback'

## plugin settings
set -g @continuum-boot                   'off'
set -g @continuum-restore                'on'
set -g @resurrect-capture-pane-contents  'on'
set -g @resurrect-strategy-nvim          'session'
set -g @resurrect-dir                    '~/.config/tmux/resurrect'
set -g @resurrect-save                   'S'
set -g @resurrect-restore                'R'
set -g @fuzzback-bind                    'f'
set -g @fuzzback-popup                   1
set -g @fuzzback-hide-preview            1

## run tpm ...
run -b '~/.config/tmux/plugins/tpm/tpm'

# keybindings
set -g repeat-time 1000
unbind C-b
unbind Space
set-option -g prefix 'C-z'
bind-key C-z send-prefix

bind-key -r C-p previous-window
bind-key -r C-n next-window
bind-key C-l last-window
bind-key l last-pane
bind-key L switch-client -l

is_editor="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?(g?(view|n?vim?x?)(diff)?|emacs(client)?(-[0-9.]+)?)$'"
no_float="if -F '#{!:#{pane_floating_flag}}'"

# pane navigation
bind-key -n 'M-h' if-shell "$is_editor" 'send-keys M-h' 'select-pane -LZ'
bind-key -n 'M-j' if-shell "$is_editor" 'send-keys M-j' 'select-pane -DZ'
bind-key -n 'M-k' if-shell "$is_editor" 'send-keys M-k' 'select-pane -UZ'
bind-key -n 'M-l' if-shell "$is_editor" 'send-keys M-l' 'select-pane -RZ'

# pane resize
## resize-pane on floating panes corrupts the tiled layout in tmux 3.7
bind-key -n 'M-H' if-shell "$is_editor" 'send-keys M-H' "$no_float 'resize-pane -L 5'"
bind-key -n 'M-J' if-shell "$is_editor" 'send-keys M-J' "$no_float 'resize-pane -D 5'"
bind-key -n 'M-K' if-shell "$is_editor" 'send-keys M-K' "$no_float 'resize-pane -U 5'"
bind-key -n 'M-L' if-shell "$is_editor" 'send-keys M-L' "$no_float 'resize-pane -R 5'"

# pane swap
bind-key -n 'C-M-h' if-shell "$is_editor" 'send-keys C-M-h' "$no_float 'swap-pane -s \"{left-of}\"'"
bind-key -n 'C-M-j' if-shell "$is_editor" 'send-keys C-M-j' "$no_float 'swap-pane -s \"{down-of}\"'"
bind-key -n 'C-M-k' if-shell "$is_editor" 'send-keys C-M-k' "$no_float 'swap-pane -s \"{up-of}\"'"
bind-key -n 'C-M-l' if-shell "$is_editor" 'send-keys C-M-l' "$no_float 'swap-pane -s \"{right-of}\"'"

# pane cycling
bind-key o select-pane -t :.+
bind-key O select-pane -t :.-

bind-key 'C-t' select-layout main-vertical
bind-key 'C-c' new-pane -x 100 -y 24 -X 10 -Y 10

# copy mode
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Y   send-keys -X copy-line
bind-key -T copy-mode-vi V   send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# launchbar integration on mac
if-shell '[ "$(uname)" = "Darwin" ]' {
  bind-key -T copy-mode-vi C-j send-keys -X copy-pipe-and-cancel \
    'xargs -0 osascript -e "on run argv" -e "tell application \"LaunchBar\"" -e "set selection to item 1 of argv" -e "activate" -e "end tell" -e "end run"'
}

unbind r
bind r "source-file ~/.config/tmux/tmux.conf; display-message 'Sourced and reloaded tmux.conf!'"

bind C-Space if-shell -F '#{==:#{session_name},_scratch}' \
    { detach-client } \
    { run-shell '~/.config/tmux/scratchpad.tmux "#{pane_current_path}"' }

# session picker
bind C-s display-popup -w 30% -h 25% -E "\
  last=\"$(tmux display-message -p '#{client_last_session}')\"; \
  tmux has-session -t \"\$last\" 2>/dev/null || last=''; \
  tmux list-sessions -f '#{!=:#{session_name},_scratch}' -F '#{session_name}#{?session_attached, (attached),}' | \
  awk -v last=\"\$last\" 'last!=\"\" && index(\$0,last)==1 {first=\$0; next} {rest[++n]=\$0} END{if(first) print first; for(i=1;i<=n;i++) print rest[i]}' | \
  fzf --reverse | sed 's/ (attached)//' | xargs tmux switch-client -t"

# pane picker across all open sessions
bind C-w display-popup -w 30% -h 25% -E "\
  tmux list-panes -a -f '#{!=:#{session_name},_scratch}' \
    -F '#{pane_id}:#{session_name} [#{window_index}:#{pane_index}] #{pane_title}#{?session_attached, (attached),}' | \
  fzf --reverse --with-nth=2.. --delimiter=: | \
  cut -d: -f1 | xargs tmux switch-client -t"

bind C command-prompt -p "New session:" "new-session -s '%%'"
bind X confirm-before -p "Kill session #S? (y/n)" \
    "run-shell 'tmux switch-client -n \\; kill-session -t \"#S\"'"
