# basic settings
set  -g default-terminal   tmux-256color
setw -g mode-keys          vi
set  -g mouse              on
set  -g display-panes-time 1000
set  -g history-limit      50000
set  -g focus-events       on
set  -g allow-passthrough  on
set  -g extended-keys      on

set -s escape-time   0

setw -g automatic-rename  on
setw -g monitor-activity  on
setw -g clock-mode-style  12
setw -g alternate-screen  on

set  -g visual-activity   off
set  -g visual-bell       off
set  -g display-time      4000
set  -g status-keys       emacs
setw -g aggressive-resize on

set  -g default-shell     /bin/zsh
set  -g default-command   /bin/zsh
set  -g set-titles        on
set  -g set-titles-string "#{session_name}"
setw -g allow-rename     on
set  -g allow-passthrough on
set  -g renumber-windows  on
set  -g detach-on-destroy no-detached

# terminal settings
set -sa terminal-overrides ",tmux-256color:Tc,xterm*:Tc"
## undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
## colored underline support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
## extended keys
set -as terminal-features 'xterm*:extkeys'

# mode
set -g mode-style bg=brightblack,fg=default

# status bar
set -g status-left-length  100
set -g status-right-length 100

## status position
set -g status-position top
set -g status-justify  right

## status update interval
set -g status-interval 5

## status bar colors
set -g status-style  bg=default,fg=default
set -g message-style bg=default,fg=yellow

## left status
set -g  status-left "#[bg=default,fg=brightblue,bold] #S "
set -ga status-left "#[default][#[fg=yellow]#I:#P#[default]]#[fg=brightblack,bold]@"
set -ga status-left "#[fg=red]#H#[default]  "
set -ga status-left "#{?client_prefix,#[fg=yellow bold]CMD,}"
set -ga status-left "#{?pane_in_mode,#[fg=blue bold]-- COPY -- ,}"
set -ga status-left "#{?pane_synchronized,#[fg=magenta bold]-- SYNC -- ,}"

## right status
set -g status-right " "

## window status
set -g  window-status-current-format "#[fg=brightblack,bg=green,bold] #I "
set -ga window-status-current-format "#[default,bold] #{?window_zoomed_flag,[#W],#W}"
set -g  window-status-format         "#[fg=white,bg=brightblack,bold]#{?window_activity_flag,#[bg=brightred],} #I "
set -ga window-status-format         "#[bg=default,fg=white,nobold] #{?window_zoomed_flag,[#W],#W}"
set -g  window-status-separator      "  "
set -g  window-status-activity-style fg=white,bg=default

## hide status bar when there's only one window
set -g status off
set-hook -g after-new-window      'if "[ #{session_windows} -gt 1 ]" "set status on"'
set-hook -g after-kill-pane       'if "[ #{session_windows} -lt 2 ]" "set status off"'
set-hook -g pane-exited           'if "[ #{session_windows} -lt 2 ]" "set status off"'
set-hook -g window-layout-changed 'if "[ #{session_windows} -lt 2 ]" "set status off"'

# panes
## pane border
set -g pane-border-style        bg=default,fg=brightblack
set -g pane-active-border-style bg=default,fg=white
set -g pane-border-status       top



# hide pane border when only one pane is active
set-hook -g -w pane-focus-in "set-option -Fw pane-border-status '#{?#{e|>:#{window_panes},1},top,off}'"

## pane number indicator
set -g display-panes-colour        brightblack
set -g display-panes-active-colour brightwhite

## pane setup
set -g main-pane-height "60%"
set -g main-pane-width  "60%"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

## plugin settings
set -g @continuum-boot                   'off'
set -g @continuum-restore                'on'
set -g @resurrect-capture-pane-contents  'on'
set -g @resurrect-strategy-nvim          'session'
set -g @resurrect-dir                    '~/.config/tmux/resurrect'

## run tpm ...
run -b '~/.config/tmux/plugins/tpm/tpm'

# keybindings
set -g repeat-time 1000
unbind C-b
set-option -g prefix 'C-s'
bind-key C-s send-prefix
bind-key C-p previous-window
bind-key C-n next-window

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -LZ'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -DZ'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -UZ'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -RZ'
bind-key -n 'M-Left' if-shell "$is_vim" 'send-keys M-Left' 'select-pane -LZ'
bind-key -n 'M-Down' if-shell "$is_vim" 'send-keys M-Down' 'select-pane -DZ'
bind-key -n 'M-Up' if-shell "$is_vim" 'send-keys M-Up' 'select-pane -UZ'
bind-key -n 'M-Right' if-shell "$is_vim" 'send-keys M-Right' 'select-pane -RZ'

bind-key -n 'M-H' if-shell "$is_vim" 'send-keys M-H' 'resize-pane -L 5'
bind-key -n 'M-J' if-shell "$is_vim" 'send-keys M-J' 'resize-pane -D 5'
bind-key -n 'M-K' if-shell "$is_vim" 'send-keys M-K' 'resize-pane -U 5'
bind-key -n 'M-L' if-shell "$is_vim" 'send-keys M-L' 'resize-pane -R 5'
bind-key -n 'M-S-Left' if-shell "$is_vim" 'send-keys M-S-Left' 'resize-pane -L 5'
bind-key -n 'M-S-Down' if-shell "$is_vim" 'send-keys M-S-Down' 'resize-pane -D 5'
bind-key -n 'M-S-Up' if-shell "$is_vim" 'send-keys M-S-Up' 'resize-pane -U 5'
bind-key -n 'M-S-Right' if-shell "$is_vim" 'send-keys M-S-Right' 'resize-pane -R 5'

bind-key -n 'C-M-h' if-shell "$is_vim" 'send-keys C-M-h' 'swap-pane -s "{left-of}"'
bind-key -n 'C-M-j' if-shell "$is_vim" 'send-keys C-M-j' 'swap-pane -s "{down-of}"'
bind-key -n 'C-M-k' if-shell "$is_vim" 'send-keys C-M-k' 'swap-pane -s "{up-of}"'
bind-key -n 'C-M-l' if-shell "$is_vim" 'send-keys C-M-l' 'swap-pane -s "{right-of}"'
bind-key -n 'C-M-Left' if-shell "$is_vim" 'send-keys C-M-Left' 'swap-pane -s "{left-of}"'
bind-key -n 'C-M-Down' if-shell "$is_vim" 'send-keys C-M-Down' 'swap-pane -s "{down-of}"'
bind-key -n 'C-M-Up' if-shell "$is_vim" 'send-keys C-M-Up' 'swap-pane -s "{up-of}"'
bind-key -n 'C-M-Right' if-shell "$is_vim" 'send-keys C-M-Right' 'swap-pane -s "{right-of}"'

bind-key -n "C-;" last-pane -Z
bind-key '_' split-window -v -c '#{pane_current_path}'
bind-key '"' split-window -h -c '#{pane_current_path}'
bind-key 'v' swap-pane -Z

bind-key C-j run-shell popmux

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle \; send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Y send-keys -X copy-selection-no-clear

# launchbar integration on mac
if-shell 'test "$(uname)" = "Darwin"' {
    bind-key -T copy-mode-vi L send-keys -X copy-selection-and-cancel \; \
        run-shell 'osascript -e "tell application \"LaunchBar\" to activate" -e "tell application \"LaunchBar\" to set selection to (the clipboard as string)"'
}

unbind r
bind r "source-file ~/.config/tmux/tmux.conf; display-message 'Sourced and reloaded tmux.conf!'"

bind Enter copy-mode
bind C-c setw synchronize-panes

# session picker
bind s display-popup -w 30% -h 25% -E "\
  last=\"$(tmux display-message -p '#{client_last_session}')\"; \
  tmux has-session -t \"\$last\" 2>/dev/null || last=''; \
  tmux list-sessions -F '#{session_name}#{?session_attached, (attached),}' | \
  awk -v last=\"\$last\" 'last!=\"\" && index(\$0,last)==1 {first=\$0; next} {rest[++n]=\$0} END{if(first) print first; for(i=1;i<=n;i++) print rest[i]}' | \
  fzf --reverse | sed 's/ (attached)//' | xargs tmux switch-client -t"

# pane picker across all open sessions
bind p display-popup -w 30% -h 25% -E "\
  tmux list-panes -a \
    -F '#{pane_id}:#{session_name} [#{window_index}:#{pane_index}] #{pane_title}#{?session_attached, (attached),}' | \
  fzf --reverse --with-nth=2.. --delimiter=: | \
  cut -d: -f1 | xargs tmux switch-client -t"

bind C command-prompt -p "New session:" "new-session -s '%%'"
bind X confirm-before -p "Kill session #S? (y/n)" \
    "run-shell 'tmux switch-client -n \\; kill-session -t \"#S\"'"
