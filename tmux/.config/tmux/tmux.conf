# basic settings
set  -g default-terminal            xterm-256color
set  -g xterm-keys                  on
setw -g mode-keys                   vi
set  -g mouse                       on
set  -g pane-border-style           bg=default,fg=brightblack
set  -g pane-active-border-style    bg=default,fg=grey
set  -g display-panes-colour        black
set  -g display-panes-active-colour brightblack
set  -g display-panes-time          1000

set -s escape-time   0

setw -g automatic-rename  on
setw -g monitor-activity  on
setw -g clock-mode-style  12
setw -g alternate-screen  on

setw -g monitor-activity on
set  -g visual-activity  off
set  -g visual-bell      off

set -g default-shell     /bin/zsh
set -g default-command   /bin/zsh
set -g set-titles        on
set -g set-titles-string "#{session_name}"
set -g repeat-time       500
set -g renumber-windows  on
set -g detach-on-destroy off

# terminal settings
set -sa terminal-overrides ",xterm*:Tc"
## undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
## colored underline support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
## extended keys
set -as terminal-features 'xterm*:extkeys'

# mode
set -g mode-style bg=brightblack,fg=default

# status bar
set -g status-left-length  100
set -g status-right-length 100

## status position
set -g status-position top
set -g status-justify  right

## status update interval
set -g status-interval 5

## status bar colors
set -g status-style  bg=default,fg=default
set -g message-style bg=default,fg=yellow

## left status
set -g  status-left "#[bg=default,fg=brightblue,bold] #S "
set -ga status-left "#[default][#[fg=yellow]#I:#P#[default]]#[fg=brightblack,bold]@"
set -ga status-left "#[fg=red]#H#[default] #{prefix_highlight}"

## right status
set -g status-right " "

## window status
set -g  window-status-current-format "#[fg=brightblack,bg=green,bold] #I "
set -ga window-status-current-format "#[default,bold] #{?window_zoomed_flag,[#W],#W}"
set -g  window-status-format         "#[fg=white,bg=brightblack,bold]#{?window_activity_flag,#[bg=brightred],} #I "
set -ga window-status-format         "#[bg=default,fg=white,nobold] #{?window_zoomed_flag,[#W],#W}"
set -g  window-status-separator      "  "
set -g  window-status-activity-style fg=white,bg=default

## hide status bar when there's only one window
set -g status off
set-hook -g after-new-window      'if "[ #{session_windows} -gt 1 ]" "set status on"'
set-hook -g after-kill-pane       'if "[ #{session_windows} -lt 2 ]" "set status off"'
set-hook -g pane-exited           'if "[ #{session_windows} -lt 2 ]" "set status off"'
set-hook -g window-layout-changed 'if "[ #{session_windows} -lt 2 ]" "set status off"'

# panes
## pane border
set -g pane-border-style        bg=default,fg=brightblack
set -g pane-active-border-style bg=default,fg=white
set -g pane-border-status       top
set -g pane-border-format       "[#P]"

# hide pane border when only one pane is active
set-hook -g -w pane-focus-in "set-option -Fw pane-border-status '#{?#{e|>:#{window_panes},1},top,off}'"

## pane number indicator
set -g display-panes-colour        brightblack
set -g display-panes-active-colour brightwhite

## pane setup
set -g main-pane-height "60%"
set -g main-pane-width  "60%"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

## plugin settings
set -g @continuum-boot                   'off'
set -g @continuum-restore                'on'
set -g @resurrect-capture-pane-contents  'on'
set -g @resurrect-strategy-nvim          'session'
set -g @resurrect-dir                    '~/.config/tmux/resurrect'
set -g @prefix_highlight_empty_attr      ''
set -g @prefix_highlight_fg              'yellow,bold'
set -g @prefix_highlight_bg              'default'
set -g @prefix_highlight_copy_mode_attr  'fg=blue,bold'
set -g @prefix_highlight_sync_mode_attr  'fg=magenta,bold'
set -g @prefix_highlight_show_copy_mode  'on'
set -g @prefix_highlight_show_sync_mode  'on'
set -g @prefix_highlight_empty_prompt    ''
set -g @prefix_highlight_prefix_prompt   'CMD'
set -g @prefix_highlight_copy_prompt     '-- COPY --'
set -g @prefix_highlight_sync_prompt     '-- SYNC --'

## run tpm ...
run -b '~/.config/tmux/plugins/tpm/tpm'

# keybindings
set -g repeat-time 1000
unbind C-b
set-option -g prefix 'C-x'
bind-key 'C-x' send-prefix

bind-key -n 'M-h' 'select-pane -LZ'
bind-key -n 'M-j' 'select-pane -DZ'
bind-key -n 'M-k' 'select-pane -UZ'
bind-key -n 'M-l' 'select-pane -RZ'
bind-key -n 'M-Left' 'select-pane -LZ'
bind-key -n 'M-Down' 'select-pane -DZ'
bind-key -n 'M-Up' 'select-pane -UZ'
bind-key -n 'M-Right' 'select-pane -RZ'

bind-key -n 'M-H' 'resize-pane -L 5'
bind-key -n 'M-J' 'resize-pane -D 5'
bind-key -n 'M-K' 'resize-pane -U 5'
bind-key -n 'M-L' 'resize-pane -R 5'
bind-key -n 'M-S-Left' 'resize-pane -L 5'
bind-key -n 'M-S-Down' 'resize-pane -D 5'
bind-key -n 'M-S-Up' 'resize-pane -U 5'
bind-key -n 'M-S-Right' 'resize-pane -R 5'

bind-key -n 'C-M-h' 'swap-pane -s "{left-of}"'
bind-key -n 'C-M-j' 'swap-pane -s "{down-of}"'
bind-key -n 'C-M-k' 'swap-pane -s "{up-of}"'
bind-key -n 'C-M-l' 'swap-pane -s "{right-of}"'
bind-key -n 'C-M-Left' 'swap-pane -s "{left-of}"'
bind-key -n 'C-M-Down' 'swap-pane -s "{down-of}"'
bind-key -n 'C-M-Up' 'swap-pane -s "{up-of}"'
bind-key -n 'C-M-Right' 'swap-pane -s "{right-of}"'

bind-key '_' split-window -v -c '#{pane_current_path}'
bind-key '"' split-window -h -c '#{pane_current_path}'
bind-key 'v' swap-pane -Z

bind-key 'C-j' run-shell popmux

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle \; send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# launchbar integration on mac
if-shell 'test "$(uname)" = "Darwin"' {
    bind-key -T copy-mode-vi L send-keys -X copy-selection-and-cancel \; \
        run-shell 'osascript -e "tell application \"LaunchBar\" to activate" -e "tell application \"LaunchBar\" to set selection to (the clipboard as string)"'
}

unbind r
bind r "source-file ~/.config/tmux/tmux.conf; display-message 'Sourced and reloaded tmux.conf!'"

bind Enter copy-mode
bind C-c setw synchronize-panes
